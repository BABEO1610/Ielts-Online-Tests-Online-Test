name: CI/CD Pipeline to VPS

on:
  push:
    branches:
      - main
      # Thêm nhánh của bạn nếu cần, ví dụ: feature-global-ielts-virtual-assistant/Datnt
  workflow_dispatch: # Cho phép click deploy thủ công (1-click) từ giao diện GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            cd /root/Ielts-Online-Tests-Online-Test
            git pull origin main

            docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet
            docker compose --env-file .env.production -f docker-compose.prod.yml build --no-cache backend frontend

            docker compose --env-file .env.production -f docker-compose.prod.yml \
              run --rm --no-deps backend npm run migrate:preflight
            docker compose --env-file .env.production -f docker-compose.prod.yml \
              run --rm --no-deps backend npm run migrate

            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans
            docker compose --env-file .env.production -f docker-compose.prod.yml ps

            docker compose --env-file .env.production -f docker-compose.prod.yml \
              exec -T speaking-worker sh -lc '
                set -e
                command -v ffmpeg
                command -v ffprobe
                ffmpeg -version | head -n 1
                ffprobe -version | head -n 1
              '
            docker compose --env-file .env.production -f docker-compose.prod.yml \
              exec -T backend npm run speaking:runtime-check

            # Only allowlisted lifecycle messages are printed; URLs and token-like values are redacted.
            docker compose --env-file .env.production -f docker-compose.prod.yml \
              logs --no-color --tail=100 backend speaking-worker \
              | awk '/AI Speaking worker|Claimed AI grading job|AI grading stage metric|Server is running|Migration/' \
              | sed -E 's#https?://[^ ]+#<redacted-url>#g; s/(token|secret|authorization|api[_-]?key)=[^ ]+/\1=<redacted>/Ig'
