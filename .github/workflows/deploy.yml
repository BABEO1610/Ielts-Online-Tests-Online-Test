name: CI/CD Pipeline to VPS

on:
  push:
    branches:
      - main
      # Thêm nhánh của bạn nếu cần, ví dụ: feature-global-ielts-virtual-assistant/Datnt
  workflow_dispatch: # Cho phép click deploy thủ công (1-click) từ giao diện GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 30m
          script: |
            set -e
            
            # Di chuyển vào thư mục dự án trên VPS
            # Thay đổi đường dẫn này thành thư mục chứa code thật trên VPS của bạn
            cd /root/Ielts-Online-Tests-Online-Test
            
            # Pull code mới nhất từ nhánh main
            git pull origin main
            
            # Khởi động lại Docker Compose với bản build mới
            # Nó sẽ tự động dùng file .env.production đã cấu hình trên VPS
            docker compose --env-file .env.production -f docker-compose.prod.yml build --no-cache frontend
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
            
            # Xóa các image rác cũ để giải phóng dung lượng
            docker image prune -f
